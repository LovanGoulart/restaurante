{% extends 'base.html' %}

{% block content %}
  <section class="login panel">
    <div class="eyebrow">SALÃO · COZINHA · CAIXA</div>
    <h1>
      Uma operação.
      <br />
      Todo mundo conectado.
    </h1>
    <p>Entre na sua conta para continuar.</p>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}" />
      <label>
        Usuário
        <input name="login" autocomplete="username" required maxlength="80" />
      </label>
      <label>
        Senha
        <input type="password" name="senha" autocomplete="current-password" required />
      </label>
      <button>Entrar no sistema →</button>
    </form>
    <p class="muted">
      Quer pedir de casa?
      <a href="/cadastro">Crie sua conta de cliente</a>
      ou
      <a href="/cardapio">veja o cardápio</a>
      .
    </p>
  </section>
{% endblock %}
