{% extends 'base.html' %}

{% block content %}
  <section class="login panel">
    <div class="eyebrow">SABOR · QUALIDADE · PRATICIDADE</div>
    <h1>
      Seu próximo pedido
      <br />
      começa aqui.
    </h1>
    <!--<p>Administradores: entre com seu e-mail cadastrado e senha. Equipe: use seu usuário e senha.</p>-->
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}" />
      <label>
        E-mail:
        <input name="login" autocomplete="username" required maxlength="254" />
      </label>
      <label>
        Senha:
        <input type="password" name="senha" autocomplete="current-password" required />
      </label>
      <button>Entrar no sistema →</button>
    </form>
    <p class="muted">
      Quer pedir de casa?
      <a href="{{ request.script_root }}/cadastro">Crie sua conta de cliente</a>
      ou
      <a href="{{ request.script_root }}/cardapio">veja o cardápio</a>
      .
    </p>
  </section>
{% endblock %}
