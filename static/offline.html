<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#101c32" />
  <title>Sem conexão · Restaurante Manager</title>
  <style>
    body {
      background: #101c32;
      color: #fff;
      font: 17px/1.6 system-ui;
      display: grid;
      place-items: center;
      min-height: 90vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    main {
      max-width: 430px;
    }
    h1 {
      font-size: 32px;
    }
    a {
      display: inline-block;
      padding: 14px 24px;
      background: #ff7850;
      color: #101c32;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }
    p {
      color: #b8c6dc;
    }
  </style>
  <main>
    <span style="font-size:50px">📡</span>
    <h1>Vamos reconectar?</h1>
    <p>
      A conexão com o restaurante foi interrompida. Pedidos e pagamentos precisam de
      conexão para serem confirmados.
    </p>
    <p>
      Nenhum pedido é enviado por esta tela. Volte quando a rede estiver disponível.
    </p>
    <a href="/">Tentar novamente</a>
  </main>
</html>
