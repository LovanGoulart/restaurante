<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c32">
  <title>Manager Geral · Sem conexão</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eff3f8; color: #253a53; font: 16px system-ui, sans-serif; }
    main { max-width: 470px; padding: 32px; background: white; border: 1px solid #dce5ef; border-top: 5px solid #127a70; border-radius: 16px; }
    small { color: #127a70; font-weight: 700; letter-spacing: 1px; }
    h1 { font-size: 28px; }
    p { color: #617187; line-height: 1.6; }
    a { display: inline-block; margin-top: 10px; padding: 12px 18px; border-radius: 8px; background: #127a70; color: white; text-decoration: none; }
  </style>
</head>
<body><main>
  <small>MANAGER · ADMINISTRAÇÃO GERAL</small>
  <h1>Você está sem conexão.</h1>
  <p>Conecte-se à internet para consultar os restaurantes e administrar os acessos. Seus dados continuam no servidor.</p>
  <a href="/geral/">Tentar novamente</a>
</main></body>
</html>
